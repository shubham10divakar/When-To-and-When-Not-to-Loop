# Dated price table. Costs in every run record are recomputable under any table.
# Source: Anthropic first-party API list prices (cached 2026-10-06).
# Verify against https://www.anthropic.com/pricing before running experiments.
as_of: 2026-10-06
default_model: claude-haiku-5-5
models:
  claude-haiku-5-5:
    input_per_mtok: 0.10          # prompts <= 100K tokens ($0.50 beyond)
    output_per_mtok: 0.50         # prompts <= 100K tokens ($2.50 beyond)
    cache_read_multiplier: 0.10   # κ  (verify for this model)
    cache_write_multiplier: 1.25  # 1 + ω (5-minute TTL)
    context_window: 1000000
    min_cacheable_tokens: 512
  claude-sonnet-5-5:
    input_per_mtok: 2.00
    output_per_mtok: 10.00
    cache_read_multiplier: 0.10
    cache_write_multiplier: 1.25
    context_window: 1000000
    min_cacheable_tokens: 512
  claude-opus-5-5:
    input_per_mtok: 4.00
    output_per_mtok: 20.00
    cache_read_multiplier: 0.05
    cache_write_multiplier: 1.25
    context_window: 1000000
    min_cacheable_tokens: 512
  mock:
    input_per_mtok: 0.10
    output_per_mtok: 0.50
    cache_read_multiplier: 0.10
    cache_write_multiplier: 1.25
    context_window: 200000
    min_cacheable_tokens: 0
  ollama:                         # local open-source models: no per-token price
    input_per_mtok: 0.0
    output_per_mtok: 0.0
    cache_read_multiplier: 0.10
    cache_write_multiplier: 1.0
    context_window: 32768         # = num_ctx used by the Ollama client
    min_cacheable_tokens: 0
